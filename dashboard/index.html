<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #10161c;
    --surface: #1a222a;
    --surface-alt: #202a33;
    --border: #2b3742;
    --text: #eee7da;
    --text-muted: #8c98a4;
    --amber: #e3a857;
    --amber-dim: #4a3b26;
    --teal: #5fb3a3;
    --teal-dim: #21403b;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .display {
    font-family: 'Fraunces', Georgia, serif;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 20px;
    padding-bottom: 40px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }

  .wordmark {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--text);
  }

  .subnet {
    font-size: 14px;
    color: var(--text-muted);
  }

  /* Hero status */
  .status-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 6px;
  }

  .status-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--teal);
    flex-shrink: 0;
    box-shadow: 0 0 0 4px var(--teal-dim);
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }

  .status-dot.attention {
    background: var(--amber);
    box-shadow: 0 0 0 4px var(--amber-dim);
  }

  .status-dot.pulse {
    animation: pulse 1.3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .status-headline {
    font-size: 26px;
    font-weight: 500;
    line-height: 1.3;
  }

  .status-meta {
    font-size: 14px;
    color: var(--text-muted);
    margin: 0 0 44px 25px;
  }

  section {
    margin-bottom: 44px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 0 0 14px;
  }

  /* Findings panel */
  .findings {
    background: var(--surface);
    border-left: 3px solid var(--teal);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 22px 26px;
  }

  .findings.attention {
    border-left-color: var(--amber);
  }

  .findings :is(h1, h2, h3) {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 17px;
    margin: 0 0 10px;
  }

  .findings p {
    margin: 0 0 14px;
    color: var(--text);
  }

  .findings p:last-child {
    margin-bottom: 0;
  }

  .findings table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    margin: 6px 0 18px;
  }

  .findings th {
    text-align: left;
    font-weight: 600;
    color: var(--text-muted);
    padding: 8px 12px 8px 0;
    border-bottom: 1px solid var(--border);
  }

  .findings td {
    padding: 10px 12px 10px 0;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    color: var(--text);
  }

  .findings tr:last-child td {
    border-bottom: none;
  }

  /* Device list */
  .device-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .device-row:last-child {
    border-bottom: none;
  }

  .device-ip {
    font-size: 15px;
    font-weight: 500;
  }

  .device-mac {
    font-size: 13px;
    color: var(--text-muted);
  }

  .ports {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .port-pill {
    font-size: 12px;
    color: var(--text);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 3px 10px;
  }

  .no-ports {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* States */
  .empty-state, .error-state {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 32px 28px;
    color: var(--text-muted);
    font-size: 15px;
  }

  .empty-state strong, .error-state strong {
    display: block;
    color: var(--text);
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 18px;
    margin-bottom: 8px;
  }

  footer {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-top: 8px;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--bg);
    background: var(--text);
    border: none;
    border-radius: var(--radius);
    padding: 10px 18px;
    cursor: pointer;
  }

  button:hover {
    opacity: 0.9;
  }

  button:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  .hint {
    font-size: 13px;
    color: var(--text-muted);
  }

  @media (max-width: 520px) {
    .status-headline { font-size: 22px; }
    .status-meta { margin-left: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .status-dot.pulse { animation: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <span class="wordmark display">NetPulse</span>
    <span class="subnet" id="subnet-label">—</span>
  </header>

  <div id="content">
    <!-- populated by JS -->
  </div>

  <footer>
    <button id="refresh-btn">Refresh</button>
    <span class="hint">Run the scanner on your network, then refresh here to see the latest.</span>
  </footer>
</main>

<script>
  // TODO (week 6): replace with a real per-user token once the
  // backend validates tokens for real — must match the agent's token.
  const USER_TOKEN = "test123";
  const BACKEND_URL = "http://127.0.0.1:8000";

  const content = document.getElementById("content");
  const subnetLabel = document.getElementById("subnet-label");
  const refreshBtn = document.getElementById("refresh-btn");

  function renderLoading() {
    content.innerHTML = `
      <div class="status-row">
        <span class="status-dot pulse"></span>
        <span class="status-headline display">Checking in...</span>
      </div>
    `;
  }

  function renderEmpty() {
    content.innerHTML = `
      <div class="empty-state">
        <strong>Nothing scanned yet</strong>
        Run the local scanner agent on your home network, then refresh this page to see your first result.
      </div>
    `;
  }

  function renderError() {
    content.innerHTML = `
      <div class="error-state">
        <strong>Can't reach the backend</strong>
        Make sure the NetPulse backend is running on this computer, then refresh.
      </div>
    `;
  }

  function portsHtml(device) {
    if (!device.open_ports || device.open_ports.length === 0) {
      return `<span class="no-ports">no open ports</span>`;
    }
    return `<div class="ports">` +
      device.open_ports.map(p => `<span class="port-pill">${p.port} · ${escapeHtml(p.service || "unknown")}</span>`).join("") +
      `</div>`;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderResult(data) {
    subnetLabel.textContent = data.subnet || "—";

    const explanationText = data.explanation || "";
    const allQuiet = /no changes detected/i.test(explanationText) && !(data.diff && (data.diff.new_devices?.length || data.diff.missing_devices?.length || data.diff.changed_ports?.length));

    const statusHeadline = allQuiet
      ? "All quiet on your network"
      : "Worth a look";

    const devicesHtml = (data.devices || []).map(d => `
      <div class="device-row">
        <div>
          <div class="device-ip">${escapeHtml(d.host)}</div>
          <div class="device-mac">${d.mac ? escapeHtml(d.mac) : "MAC not detected"}</div>
        </div>
        ${portsHtml(d)}
      </div>
    `).join("");

    content.innerHTML = `
      <div class="status-row">
        <span class="status-dot ${allQuiet ? "" : "attention"}"></span>
        <span class="status-headline display">${statusHeadline}</span>
      </div>
      <p class="status-meta">${(data.devices || []).length} device${(data.devices || []).length === 1 ? "" : "s"} on your network</p>

      <section>
        <p class="section-title">What Nemotron found</p>
        <div class="findings ${allQuiet ? "" : "attention"}">${marked.parse(explanationText)}</div>
      </section>

      <section>
        <p class="section-title">Devices on your network</p>
        <div>${devicesHtml}</div>
      </section>
    `;
  }

  async function loadLatest() {
    renderLoading();
    try {
      const res = await fetch(`${BACKEND_URL}/latest`, {
        headers: { "x-user-token": USER_TOKEN }
      });
      if (res.status === 404) {
        renderEmpty();
        return;
      }
      if (!res.ok) {
        renderError();
        return;
      }
      const data = await res.json();
      renderResult(data);
    } catch (err) {
      renderError();
    }
  }

  refreshBtn.addEventListener("click", loadLatest);
  loadLatest();
</script>
</body>
</html>
